name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET projects
        if: matrix.language == 'csharp'
        run: |
          dotnet restore app.sln
          dotnet restore tests/server.sqltests/server.sqltests.csproj

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build .NET projects for analysis
        if: matrix.language == 'csharp'
        # Compile every project under the CodeQL tracer, including generated Razor code.
        run: |
          dotnet build app.sln --configuration Release --no-restore --no-incremental /p:UseSharedCompilation=false
          dotnet build tests/server.sqltests/server.sqltests.csproj --configuration Release --no-restore --no-incremental /p:BuildProjectReferences=false /p:UseSharedCompilation=false

      - name: Analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          category: /language:${{ matrix.language }}
