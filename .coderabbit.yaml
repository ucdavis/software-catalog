# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: true
  # Match Mailbroker's single required CodeRabbit commit status.
  review_progress: false
  commit_status: true
  fail_commit_status: true
  poem: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: true
    base_branches: [".*"]
    ignore_title_keywords: []
    labels: []
    ignore_usernames: []
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_instructions:
    - path: "server.core/**"
      instructions: >-
        Follow AGENTS.md and docs/ARCHITECTURE.md. Check domain invariants,
        EF Core query behavior, migration safety, cancellation, and notification
        validation. Distinguish sample features from catalog requirements.
        Prefer standard .NET facilities and simple, explicit conditionals.
    - path: "server/**"
      instructions: >-
        Follow the authentication and hosting contracts in AGENTS.md and
        docs/ARCHITECTURE.md. Review server-side authorization, API 401/403
        behavior, local redirect validation, antiforgery protection, and
        Development-only local sign-in. Keep credentials and personal data out
        of logs. Verify changes to startup, static files, and publish behavior.
    - path: "client/**"
      instructions: >-
        Use the existing TypeScript, TanStack Query/Router/Form/Table, and
        Gunrock conventions. Preserve relative API URLs, cancellation, and
        observable loading/error/authentication states. Check accessibility and
        response contracts. routeTree.gen.ts is generated by Vite/TanStack Router.
    - path: "tests/**"
      instructions: >-
        Follow the test-layer boundaries in docs/TESTING.md. Assert observable
        behavior and failure guarantees. Keep tests deterministic and isolated
        from live Entra, SMTP, and deployment credentials.
    - path: "scripts/**"
      instructions: >-
        Keep tooling in standard Node.js/TypeScript. Preserve exit codes,
        explicit scan scope, redaction, temporary-file cleanup, and portable
        paths. Tests that mutate Git must use disposable repositories.
    - path: ".github/**"
      instructions: >-
        Preserve least-privilege permissions, pinned action versions, and the
        Dependabot policy in docs/DEPENDENCY_UPDATES.md. Privileged
        pull_request_target jobs must never check out or execute PR code. Keep
        approvals bound to verified current commits, required checks to their
        expected apps, and auto-merge subject to all branch protections. Treat
        CodeRabbit status, review decisions, and unresolved threads separately.
  tools:
    eslint:
      enabled: true
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    # Enable once repository-owned C#/TypeScript rules and fixtures exist.
    semgrep:
      enabled: false
